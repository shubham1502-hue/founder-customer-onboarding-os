[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "founder-customer-onboarding-os"
version = "0.1.0"
description = "Offline founder operating system for customer onboarding, activation risk, SLA risks, and founder attention queues."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Shubham Singh"}
]
dependencies = [
  "pandas>=2.0.0",
  "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
founder-customer-onboarding-os = "founder_customer_onboarding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

